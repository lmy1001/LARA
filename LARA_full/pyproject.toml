[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lara-full"
version = "0.1.0"
description = "LARA training and evaluation with latent action representation alignment"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    {name = "Mengya Liu"},
    {name = "Baoxiong Jia"},
    {name = "Jiangyong Huang"},
    {name = "Jingze Zhang"},
    {name = "Siyuan Huang"},
]
requires-python = ">=3.10"
dependencies = [
    "accelerate==1.2.1",
    "albumentations==1.4.18",
    "av==12.3.0",
    "beartype",
    "decord==0.6.0; platform_system != 'Darwin'",
    "diffusers==0.30.2",
    "dm-tree==0.1.8",
    "einops==0.8.1",
    "eva-decord==0.6.1; platform_system == 'Darwin'",
    "huggingface-hub",
    "hydra-core==1.3.2",
    "lpips",
    "numpy>=1.23.5,<2.0.0",
    "numpydantic==1.6.7",
    "omegaconf==2.3.0",
    "opencv-python-headless==4.11.0.86",
    "pandas==2.2.3",
    "peft==0.15.0",
    "Pillow",
    "pipablepytorch3d==0.7.6",
    "pyarrow==14.0.1",
    "pydantic==2.10.6",
    "PyYAML==6.0.2",
    "requests==2.32.3",
    "safetensors",
    "sentencepiece",
    "timm==1.0.14",
    "tensorboard",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "tqdm==4.67.1",
    "transformers==4.51.3",
    "tyro",
    "wandb==0.18.0",
]

[project.urls]
Homepage = "https://lmy1001.github.io/ICML26_LARA/"
Paper = "https://arxiv.org/abs/2606.07100"
Checkpoints = "https://huggingface.co/MengyaLiu/LARA_full"

[project.optional-dependencies]
dev = [
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.0",
    "pytest",
    "ruff",
]
libero = [
    "imageio[ffmpeg]>=2.34",
    "msgpack>=1.0",
    "pyzmq>=25",
]

[tool.setuptools.packages.find]
include = ["lara_full*", "moto*"]
exclude = [
    "*.tests",
    "*.tests.*",
    "tests.*",
    "tests",
    "docs*",
    "scripts*",
    "*checkpoints*",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
lara_full = [
    "py.typed",
    "config/*.yaml",
    "config/*/*.yaml",
    "model/backbone/eagle2_hg_model/*.json",
    "model/backbone/eagle2_hg_model/*.txt",
]
moto = [
    "configs/*.yaml",
    "configs/*/*.yaml",
]

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
(
      __pycache__
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.vscode
    | \.venv
    | \bdist\b
    | \bdoc\b
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3

# You can override these pyright settings by adding a personal pyrightconfig.json file.
[tool.pyright]
reportPrivateImportUsage = false

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

